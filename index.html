<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>I love you <3</title>
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      background-color: #000;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
      font-family: Arial, sans-serif;
    }
    canvas {
      display: block;
    }
    .start-btn {
      position: absolute;
      padding: 16px 36px;
      font-size: 22px;
      font-weight: bold;
      color: #ffffff;
      background: linear-gradient(135deg, #1E90FF, #00BFFF);
      border: none;
      border-radius: 40px;
      cursor: pointer;
      box-shadow: 0 0 25px rgba(30, 144, 255, 0.9);
      z-index: 10;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .start-btn:hover {
      transform: scale(1.05);
      box-shadow: 0 0 35px rgba(0, 191, 255, 1);
    }
  </style>
</head>
<body>

  <button class="start-btn" id="startBtn">▶ Toca para ver</button>
  <canvas id="canvas"></canvas>

  <audio id="audio" loop>
    <source src="love_you.mp3" type="audio/mpeg">
  </audio>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const startBtn = document.getElementById('startBtn');
    const audio = document.getElementById('audio');

    const VIRTUAL_WIDTH = 2000;
    const VIRTUAL_HEIGHT = 1200;
    const SCALE = 20;

    const WORDS = ["love you", "Love You", "LOVE YOU"];
    const COLORS = [
      "rgb(70, 130, 180)",
      "rgb(30, 144, 255)",  
      "rgb(0, 191, 255)",  
      "rgb(100, 149, 237)", 
      "rgb(65, 105, 225)"
    ];

    function heartXY(t) {
      const x = 16 * Math.pow(Math.sin(t), 3);
      const y = 13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t);
      return { x, y: -y };
    }

    function toScreen(bx, by) {
      return {
        x: bx * SCALE + VIRTUAL_WIDTH / 2,
        y: by * SCALE + VIRTUAL_HEIGHT / 2
      };
    }

    class Particle {
      constructor(x, y, order, kind) {
        this.x = x;
        this.y = y;
        this.order = order;
        this.kind = kind;
        this.word = WORDS[Math.floor(Math.random() * WORDS.length)];
        this.color = COLORS[Math.floor(Math.random() * COLORS.length)];
        this.alpha = 0;
        this.flicker = Math.random() * Math.PI * 2;
        this.delay = 0;
        this.sizeMult = 0.85 + Math.random() * 0.3; // entre 0.85 y 1.15
        this.fontSize = (kind === "outline") ? 20 : 17;
      }
    }

    function buildOutlineParticles(nOutline = 160, minGap = 30) {
      const particles = [];
      const placed = [];
      for (let i = 0; i < nOutline; i++) {
        const t = (i / nOutline) * 2 * Math.PI;
        const { x: bx, y: by } = heartXY(t);
        const { x: sx, y: sy } = toScreen(bx, by);
        
        let tooClose = false;
        for (const [px, py] of placed) {
          if (Math.hypot(sx - px, sy - py) < minGap) {
            tooClose = true;
            break;
          }
        }
        if (tooClose) continue;
        placed.push([sx, sy]);
        particles.push(new Particle(sx, sy, i, "outline"));
      }
      return particles;
    }

    function buildFillParticles(nFill = 130, minGap = 46) {
      const particles = [];
      const placed = [];
      let attempts = 0;
      const maxAttempts = nFill * 80;

      while (particles.length < nFill && attempts < maxAttempts) {
        attempts++;
        const t = Math.random() * 2 * Math.PI;
        const r = Math.random() * 0.86;
        const { x: bx, y: by } = heartXY(t);
        const px = bx * r;
        const py = by * r;
        const { x: sx, y: sy } = toScreen(px, py);

        let tooClose = false;
        for (const [qx, qy] of placed) {
          if (Math.hypot(sx - qx, sy - qy) < minGap) {
            tooClose = true;
            break;
          }
        }
        if (tooClose) continue;

        placed.push([sx, sy]);
        particles.push(new Particle(sx, sy, Math.floor(Math.random() * 320), "fill"));
      }
      return particles;
    }

    let particles = [];
    let fillStartFrame = 0;

    function initParticles() {
      const outline = buildOutlineParticles(160);
      const fill = buildFillParticles(130);

      const outlineSpan = outline.length > 0 ? Math.max(...outline.map(p => p.order)) : 0;
      const framesPerStep = 1.6;
      fillStartFrame = Math.floor(outlineSpan * framesPerStep) + 30;

      fill.forEach(p => p.delay = fillStartFrame + p.order);
      outline.forEach(p => p.delay = Math.floor(p.order * framesPerStep));

      particles = [...outline, ...fill];
    }

    function drawGlowText(word, color, x, y, alpha, fontSize, sizeMult) {
      if (alpha <= 0) return;

      const effectiveSize = Math.round(fontSize * sizeMult);
      ctx.save();
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.font = `bold ${effectiveSize}px Arial`;

      // Efecto Glow (Resplandor Neón)
      if (alpha > 10) {
        ctx.shadowColor = color;
        ctx.shadowBlur = 18;
        ctx.fillStyle = color;
        ctx.globalAlpha = (alpha / 255) * 0.4;
        ctx.fillText(word, x, y);
      }

      // Texto Principal Nitido
      ctx.shadowBlur = 0;
      ctx.fillStyle = color;
      ctx.globalAlpha = alpha / 255;
      ctx.fillText(word, x, y);

      ctx.restore();
    }

    let frame = 0;
    let animId = null;

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    function render() {
      ctx.fillStyle = "rgb(0, 0, 0)";
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.save();
      // Escalar la resolución virtual de 2000x1200 a la pantalla actual
      const scaleX = canvas.width / VIRTUAL_WIDTH;
      const scaleY = canvas.height / VIRTUAL_HEIGHT;
      const fitScale = Math.min(scaleX, scaleY);
      
      const offsetX = (canvas.width - VIRTUAL_WIDTH * fitScale) / 2;
      const offsetY = (canvas.height - VIRTUAL_HEIGHT * fitScale) / 2;
      
      ctx.translate(offsetX, offsetY);
      ctx.scale(fitScale, fitScale);

      frame++;

      // Dibujar partículas
      particles.forEach(p => {
        if (frame > p.delay && p.alpha < 255) {
          p.alpha = Math.min(255, p.alpha + 14 + Math.floor(Math.random() * 5));
        }

        let flick = 1.0;
        if (p.alpha >= 255) {
          flick = 0.75 + 0.25 * Math.sin(frame * 0.04 + p.flicker);
        }

        const alpha = Math.floor(p.alpha * flick);
        drawGlowText(p.word, p.color, p.x, p.y, alpha, p.fontSize, p.sizeMult);
      });

      // Texto central " Love You " con latido
      const centerStart = fillStartFrame + 200;
      if (frame > centerStart) {
        const progress = Math.min(1.0, (frame - centerStart) / 60);
        const centerAlpha = Math.floor(255 * (1 - Math.exp(-progress * 8)));
        const pulse = 1.0 + 0.025 * Math.sin(frame * 0.05);

        ctx.save();
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.font = `bold ${Math.round(54 * pulse)}px Georgia`;

        // Resplandor del texto central
        if (centerAlpha > 10) {
          ctx.shadowColor = "rgba(255, 250, 245, 0.8)";
          ctx.shadowBlur = 25;
          ctx.fillStyle = "rgb(255, 250, 245)";
          ctx.globalAlpha = (centerAlpha / 255) * 0.35;
          ctx.fillText(" Love You ", VIRTUAL_WIDTH / 2, VIRTUAL_HEIGHT / 2);
        }

        // Texto blanco cálido principal
        ctx.shadowBlur = 0;
        ctx.fillStyle = "rgb(255, 250, 245)";
        ctx.globalAlpha = centerAlpha / 255;
        ctx.fillText(" Love You ", VIRTUAL_WIDTH / 2, VIRTUAL_HEIGHT / 2);

        ctx.restore();
      }

      ctx.restore();
      animId = requestAnimationFrame(render);
    }

    startBtn.addEventListener('click', () => {
      startBtn.style.display = 'none';
      audio.play().catch(e => console.log(e));
      initParticles();
      render();
    });
  </script>
</body>
</html>
