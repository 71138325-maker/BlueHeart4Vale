<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blue Heart</title>
  <style>
    body {
      margin: 0;
      background-color: #000;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
      font-family: Arial, sans-serif;
    }
    canvas {
      display: block;
    }
    .btn {
      position: absolute;
      padding: 15px 30px;
      font-size: 20px;
      color: white;
      background: #1E90FF;
      border: none;
      border-radius: 30px;
      cursor: pointer;
      box-shadow: 0 0 20px rgba(30, 144, 255, 0.8);
      z-index: 10;
    }
  </style>
</head>
<body>

  <button class="btn" id="startBtn">▶ Toca para ver</button>
  <canvas id="canvas"></canvas>

  <audio id="audio" loop>
    <source src="love_you.mp3" type="audio/mpeg">
  </audio>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const startBtn = document.getElementById('startBtn');
    const audio = document.getElementById('audio');

    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    const words = ["love you", "Love You", "LOVE YOU"];
    const colors = [
      "rgb(70, 130, 180)",
      "rgb(30, 144, 255)",
      "rgb(0, 191, 255)",
      "rgb(100, 149, 237)",
      "rgb(65, 105, 225)"
    ];

    function heartPoint(t) {
      let x = 16 * Math.pow(Math.sin(t), 3);
      let y = -(13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t));
      return { x, y };
    }

    let particles = [];

    function init() {
      for (let i = 0; i < 450; i++) {
        let t = Math.random() * Math.PI * 2;
        let pt = heartPoint(t);
        particles.push({
          x: pt.x,
          y: pt.y,
          word: words[Math.floor(Math.random() * words.length)],
          color: colors[Math.floor(Math.random() * colors.length)],
          size: Math.random() * 12 + 10,
          speed: Math.random() * 0.02 + 0.005,
          offset: Math.random() * Math.PI * 2
        });
      }
    }

    let time = 0;
    function render() {
      ctx.fillStyle = "rgba(0, 0, 0, 0.2)";
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      let scale = Math.min(canvas.width, canvas.height) / 40;
      let cx = canvas.width / 2;
      let cy = canvas.height / 2;

      // Texto Central
      ctx.fillStyle = "rgb(30, 144, 255)";
      ctx.font = "bold 28px Arial";
      ctx.textAlign = "center";
      ctx.fillText("Love You", cx, cy);

      time += 0.05;

      particles.forEach(p => {
        let pulse = Math.sin(time + p.offset) * 1.5;
        let x = cx + p.x * (scale + pulse);
        let y = cy + p.y * (scale + pulse);

        ctx.fillStyle = p.color;
        ctx.font = `${p.size}px Arial`;
        ctx.fillText(p.word, x, y);
      });

      requestAnimationFrame(render);
    }

    startBtn.addEventListener('click', () => {
      startBtn.style.display = 'none';
      audio.play();
      init();
      render();
    });
  </script>
</body>
</html>
