<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Corazón Azul</title>
  <style>
    body {
      margin: 0;
      background-color: #050515;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
      font-family: Arial, sans-serif;
      color: #fff;
    }
    canvas {
      border: none;
    }
    .play-btn {
      position: absolute;
      padding: 12px 24px;
      font-size: 18px;
      background-color: #0088ff;
      color: white;
      border: none;
      border-radius: 25px;
      cursor: pointer;
      box-shadow: 0 0 15px rgba(0, 136, 255, 0.6);
      z-index: 10;
      transition: transform 0.2s;
    }
    .play-btn:hover {
      transform: scale(1.05);
    }
  </style>
</head>
<body>

  <button class="play-btn" id="startBtn">▶ Toca para abrir</button>
  <canvas id="canvas"></canvas>

  <audio id="music" loop>
    <source src="love_you.mp3" type="audio/mpeg">
  </audio>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const startBtn = document.getElementById('startBtn');
    const music = document.getElementById('music');

    function resize() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    let points = [];
    let particles = [];
    let angle = 0;

    function heartShape(t) {
      let x = 16 * Math.pow(Math.sin(t), 3);
      let y = -(13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t));
      return { x, y };
    }

    startBtn.addEventListener('click', () => {
      startBtn.style.display = 'none';
      music.play().catch(e => console.log(e));
      animate();
    });

    function animate() {
      ctx.fillStyle = 'rgba(5, 5, 21, 0.1)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      let scale = Math.min(canvas.width, canvas.height) / 40;
      let cx = canvas.width / 2;
      let cy = canvas.height / 2;

      let pos = heartShape(angle);
      particles.push({
        x: cx + pos.x * scale,
        y: cy + pos.y * scale,
        size: Math.random() * 3 + 1,
        alpha: 1,
        color: `hsl(${200 + Math.random() * 40}, 100%, 60%)`
      });

      angle += 0.05;

      for (let i = particles.length - 1; i >= 0; i--) {
        let p = particles[i];
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fillStyle = p.color;
        ctx.globalAlpha = p.alpha;
        ctx.fill();
        p.alpha -= 0.005;
        if (p.alpha <= 0) particles.splice(i, 1);
      }
      ctx.globalAlpha = 1;

      requestAnimationFrame(animate);
    }
  </script>
</body>
</html>
